mud:
  name: Zm Mud
  server:
    name: 北大侠客行
    host: mud.pkuxkx.net
    port: 8080
    charset: GBK
  inbound:
    reader:
      buffer:
        maxLength: 1024
  ui:
    # 客户端模拟的终端类型名（必须是标准的大写 ASCII 字符串，如 VT100, XTERM, ANSI）
    terminalType: ANSI 
    size:
      width: 800
      height: 600
    font:
      name: 宋体
      # name: Consolas
      size: 12
    # theme: LIGHT
    theme: DARK
    showTimestamp: false
    displayBufLineNumber: 500
